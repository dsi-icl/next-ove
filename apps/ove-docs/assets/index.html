<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>next-ove docs</title>
  <link rel="icon" type="image/x-icon" href="%BASE_PATH%/favicon.ico?v1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-icons@latest/dist/umd/lucide.min.js">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="%BASE_PATH%/styles.css">
</head>
<body>
<div class="app">
  <div class="sidebar-wrapper">
    <div class="sidebar" data-state="expanded">
      <div class="sidebar-header">
        <button class="sidebar-logo" onclick="changeState(null)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
            <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"></path>
            <path d="M3 9V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4"></path>
            <path d="M3 9h4"></path>
            <path d="M17 9h4"></path>
          </svg>
          <span>next-ove docs</span>
        </button>
      </div>

      <div class="sidebar-content">
        <div id="api-group" class="sidebar-group">
          <div class="sidebar-group-label">APIs</div>
          <div class="sidebar-group-content">
            <ul class="sidebar-menu" id="api-list">
            </ul>
          </div>
        </div>

        <div id="api-separator" class="sidebar-separator"></div>

        <div id="code-group" class="sidebar-group">
          <div class="sidebar-group-label">Code</div>
          <div class="sidebar-group-content">
            <ul role="list" id="code-list">
              <li class="sidebar-menu-item">
                <button onclick="changeState('%BASE_PATH%/code')" class="sidebar-menu-button">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-code icon"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                  <span>Documentation</span>
                </button>
              </li>
            </ul>
          </div>
        </div>

        <div id="code-separator" class="sidebar-separator"></div>

        <div id="compatibility-group" class="sidebar-group">
          <div class="sidebar-group-label">Compatibility</div>
          <div class="sidebar-group-content">
            <ul role="list" id="types-list">
              <li class="sidebar-menu-item">
                <button onclick="changeState('%BASE_PATH%/compatibility/css/static/browser-usage.json')" class="sidebar-menu-button">CSS</button>
              </li>
            </ul>
          </div>
        </div>

        <div id="compatibility-separator" class="sidebar-separator"></div>

        <div id="features-group" class="sidebar-group">
          <div class="sidebar-group-label">Features</div>
          <div class="sidebar-group-content">
            <ul role="list" id="feature-list"></ul>
          </div>
        </div>

        <div id="features-separator" class="sidebar-separator"></div>

        <div id="packages-group" class="sidebar-group">
          <div class="sidebar-group-label">Packages</div>
          <div class="sidebar-group-content">
            <ul role="list" id="packages-list">
              <li class="sidebar-menu-item">
                <button onclick="changeState('%BASE_PATH%/packages/audit')" class="sidebar-menu-button">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package icon"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
                  <span>Audit</span>
                </button>
              </li>
              <li class="sidebar-menu-item">
                <button class="sidebar-menu-button" onclick="changeState('%BASE_PATH%/packages/deprecated')">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package icon"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
                  <span>Deprecated</span>
                </button>
              </li>
              <li class="sidebar-menu-item">
                <button class="sidebar-menu-button" onclick="changeState('%BASE_PATH%/packages/directory')">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package icon"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
                  <span>Directory</span>
                </button>
              </li>
              <li class="sidebar-menu-item">
                <button class="sidebar-menu-button collapsible-trigger">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package icon"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
                  <span>Security</span>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon chevron">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>
                <ul role="list" class="sidebar-menu-sub">
                  <li class="sidebar-menu-sub-item">
                    <button class="sidebar-menu-sub-button" onclick="changeState('%BASE_PATH%/packages/dependencies')">Dependencies</button>
                  </li>
                  <li class="sidebar-menu-sub-item">
                    <button class="sidebar-menu-sub-button" onclick="changeState('%BASE_PATH%/packages/report.json')">Report</button>
                  </li>
                  <li class="sidebar-menu-sub-item">
                    <button class="sidebar-menu-sub-button" onclick="changeState('%BASE_PATH%/packages/treemap.svg')">Treemap</button>
                  </li>
                </ul>
              </li>
              <li class="sidebar-menu-item">
                <button class="sidebar-menu-button" onclick="changeState('%BASE_PATH%/packages/updates')">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package icon"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
                  <span>Updates</span>
                </button>
              </li>
            </ul>
          </div>
        </div>

        <div id="packages-separator" class="sidebar-separator"></div>

        <div id="specifications-group" class="sidebar-group">
          <div class="sidebar-group-label">Specifications</div>
          <div class="sidebar-group-content">
            <ul role="list" id="spec-list"></ul>
          </div>
        </div>

        <div id="specifications-separator" class="sidebar-separator"></div>

        <div id="test-coverage-group" class="sidebar-group">
          <div class="sidebar-group-label">Test Coverage</div>
          <div class="sidebar-group-content">
          <ul role="list" id="coverage-list"></ul>
          </div>
        </div>

        <div id="test-coverage-separator" class="sidebar-separator"></div>

        <div id="types-group" class="sidebar-group">
          <div class="sidebar-group-label">Types</div>
          <div class="sidebar-group-content">
            <ul role="list" id="type-list">
              <li class="sidebar-menu-item">
                <button onclick="changeState('%BASE_PATH%/types')" class="sidebar-menu-button">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-brick-wall icon"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 9v6"/><path d="M16 15v6"/><path d="M16 3v6"/><path d="M3 15h18"/><path d="M3 9h18"/><path d="M8 15v6"/><path d="M8 3v6"/></svg>
                  <span>Documentation</span>
                </button>
              </li>
              <li class="sidebar-menu-item">
                <button class="sidebar-menu-button" onclick="changeState('%BASE_PATH%/coverage/static/types')" id="type-coverage">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-brick-wall icon"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 9v6"/><path d="M16 15v6"/><path d="M16 3v6"/><path d="M3 15h18"/><path d="M3 9h18"/><path d="M8 15v6"/><path d="M8 3v6"/></svg>
                  <span>Coverage</span>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="top-bar">
      <button class="sidebar-toggle" aria-label="Toggle Sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
          <path d="M3 7h18"></path>
          <path d="M3 12h18"></path>
          <path d="M3 17h18"></path>
        </svg>
      </button>
      <h1>next-ove docs</h1>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="%BASE_PATH%/main.js"></script>
</body>
</html>
